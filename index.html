<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiTech Sir — Creator Platform &amp; SEO Optimizer</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --border: #e2e8f0;
      --banner-bg: #f0fdfa;
      --banner-border: #99f6e4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--accent-dark);
    }
    .sub {
      font-size: 0.85rem;
      color: var(--muted);
    }
    main {
      max-width: 760px;
      margin: 24px auto;
      padding: 0 16px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.92rem;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      background: #fff;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .quota-note {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      color: var(--accent-dark);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .result-item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 10px;
      background: #f8fafc;
    }
    .error-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">DigiTech Sir</div>
      <div class="sub">Creator Tools &amp; SEO Optimizer</div>
    </div>
    <div class="sub" id="quotaBadge">Limit: 0/2 used today</div>
  </header>

  <main>
    <div class="card">
      <h1 style="margin-top:0;font-size:1.3rem;">Title Generator</h1>
      <label for="topicInput">Video Topic</label>
      <input id="topicInput" type="text" placeholder="e.g. Maths reasoning tricks" />

      <label for="langSelect">Language</label>
      <select id="langSelect">
        <option value="hinglish" selected>Hinglish</option>
        <option value="hindi">Hindi</option>
        <option value="english">English</option>
      </select>

      <button id="generateBtn" type="button">Generate 10 Titles</button>
      <div id="statusArea"></div>
      <div id="resultsArea"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://ekvwczxeosndmjjirpin.supabase.co";
    const SEO_AI_ENDPOINT = `${SUPABASE_URL}/functions/v1/seo-ai`;

    const topicInput = document.getElementById("topicInput");
    const langSelect = document.getElementById("langSelect");
    const generateBtn = document.getElementById("generateBtn");
    const statusArea = document.getElementById("statusArea");
    const resultsArea = document.getElementById("resultsArea");
    const quotaBadge = document.getElementById("quotaBadge");

    function formatQuotaStatus(quota) {
      const used = Number(quota?.usedToday ?? 0);
      const limit = Number(quota?.dailyLimit ?? 2);
      return `Limit: ${used}/${limit} used today`;
    }

    generateBtn.addEventListener("click", async () => {
      const topic = topicInput.value.trim();
      if (!topic) {
        statusArea.innerHTML = `<div class="error-box">Kripya pehle ek topic likhein.</div>`;
        return;
      }

      generateBtn.disabled = true;
      statusArea.innerHTML = `<div class="quota-note">Generating SEO output...</div>`;
      resultsArea.innerHTML = "";

      try {
        const res = await fetch(SEO_AI_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tool: "title",
            topic,
            language: langSelect.value,
            userKey: "web_user"
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data?.message || data?.error || `Request failed (${res.status})`);
        }

        if (data?.quota) {
          const statusText = formatQuotaStatus(data.quota);
          quotaBadge.textContent = statusText;
          statusArea.innerHTML = `<div class="quota-note">${statusText}</div>`;
        } else {
          statusArea.innerHTML = "";
        }

        const titles = Array.isArray(data?.titles) ? data.titles : [];
        if (titles.length) {
          resultsArea.innerHTML = titles
            .map((t, idx) => `<div class="result-item"><strong>${idx + 1}.</strong> ${String(t)}</div>`)
            .join("");
        } else {
          resultsArea.innerHTML = `<div class="result-item"><pre style="margin:0;white-space:pre-wrap;">${JSON.stringify(data, null, 2)}</pre></div>`;
        }
      } catch (err) {
        statusArea.innerHTML = `<div class="error-box">${err.message || "Something went wrong"}</div>`;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
